# Build optimizations for faster development iteration

[target.x86_64-unknown-linux-gnu]
linker = "clang"
# `--allow-multiple-definition`: webrtc-sys statically bundles BoringSSL and
# openssl-sys (vendored) bundles OpenSSL; both export the same crypto symbols
# (RSA_padding_*, PKCS1_MGF1, vpaes_*, …). mold refuses the duplicates. The
# linker picks the first definition it sees (openssl-sys, since it's higher
# in the link order) — BoringSSL in webrtc-sys is only used for DTLS/SRTP in
# the WebRTC stack, and those paths don't reach this binary at runtime, so
# the collision is benign. Required for the desktop build after the link-device
# work pulled libsignal + webrtc into the same link target.
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "link-arg=-Wl,--allow-multiple-definition",
    "-C", "target-cpu=native",
]

[target.x86_64-pc-windows-msvc]
# Match libwebrtc's /MT CRT. SQLCipher must use the same bundled BoringSSL
# (the Windows workflow stages it as libcrypto.lib), not a second OpenSSL.
# Do not suppress duplicate-symbol errors: that can hide incompatible crypto ABIs.
rustflags = ["-C", "target-feature=+crt-static"]

[build]
# Use sccache for compilation caching
rustc-wrapper = "sccache"

# Leave build.jobs to the user/global config; tune it for available memory.

[env]
# webrtc-sys 0.3.24 auto-compiled a broken VA-API H.264 encoder shim when
# libva.pc was detected — the shim #include'd internal webrtc headers that
# the prebuilt didn't ship. 0.3.29 handles this correctly; we leave the
# wrapper-free path on so VAAPI compiles in for AMD/Intel boxes. If the
# build breaks again, restore the shim:
#   PKG_CONFIG = { value = "tools/pkg-config-nolibva", relative = true }
#
# Arch installs the CUDA toolkit at `/opt/cuda`. webrtc-sys defaults
# `CUDA_HOME` to `/usr/local/cuda`, which doesn't exist here, so without
# this hint the NVENC encoder path silently never gets built and screen
# share falls back to OpenH264 software (60+ fps on a beefy NVIDIA box
# would otherwise be impossible — encoder is the bottleneck at high res).
CUDA_HOME = "/opt/cuda"
