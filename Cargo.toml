[workspace]
members = [
    "crates/chatter-core",
    "crates/chatter-mesh",
    "crates/chatter-mesh-android",
    "crates/chatter-mesh-ble",
    "crates/chatter-mesh-link",
    "crates/chatter-mesh-noise",
    "crates/chatter-mesh-nostr",
    "crates/chatter-mesh-store",
    "crates/chatter-ui",
]
# The fuzz crate must NOT be a workspace member — otherwise libfuzzer-sys
# (which requires `-Z sanitizer=address` and a nightly toolchain) gets pulled
# into normal `cargo build` resolution. It lives under chatter-core/fuzz/ and
# is built standalone via `cargo +nightly fuzz run …`.
exclude = ["crates/chatter-core/fuzz"]
resolver = "3"

# android-activity 0.6.1 from crates.io (git main was causing JVM attach failures)

# =============================================================================
# Development Profile - Optimized for fast rebuilds
# =============================================================================
[profile.dev]
opt-level = 0          # No optimization for your code (fast compile)
debug = 0              # No debug symbols (faster linking)
incremental = true     # Incremental compilation
codegen-units = 256    # More parallelism

# Optimize dependencies but not your code
[profile.dev.package."*"]
opt-level = 2          # Dependencies are optimized (they don't change often)
debug = false

# =============================================================================
# Release Profile - Optimized for size and speed
# =============================================================================
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

# =============================================================================
# Release-Dev Profile — Optimized binary for perf/RSS testing against the local
# docker-compose dev server.
#
# The sealed-sender trust root is NOT selected by this profile. It used to be:
# `debug-assertions = true` existed solely to keep cfg(debug_assertions) active
# so config.rs would pick the dev trust root, which meant an optimized "release"
# build silently trusted a key whose private half is in this repository. The
# trust root is now the explicit `dev-trust-root` cargo feature — pass
# `--features chatter-core/dev-trust-root` (or chatter-ui/dev-trust-root) when
# pointing this profile at the dev Vault.
# =============================================================================
[profile.release-dev]
inherits = "release"
opt-level = 3
overflow-checks = false
strip = "debuginfo"
lto = "thin"

# Vendored + patched Slint Android backend: dedupe GameTextInput state pushes so
# the IME isn't restarted on every keystroke (fixes dropped keystrokes / input
# lag, slint-ui/slint #9240). See vendor/i-slint-backend-android-activity/.
[patch.crates-io]
i-slint-backend-android-activity = { path = "vendor/i-slint-backend-android-activity" }
