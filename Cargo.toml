[workspace]
members = [
    "crates/chatter-core",
    "crates/chatter-ui",
    "crates/chatter-tui",
]
resolver = "3"

[patch.crates-io]
android-activity = { git = "https://github.com/rust-mobile/android-activity", branch = "main" }

# =============================================================================
# Development Profile - Optimized for fast rebuilds
# =============================================================================
[profile.dev]
opt-level = 0          # No optimization for your code (fast compile)
debug = 0              # No debug symbols (faster linking)
incremental = true     # Incremental compilation
codegen-units = 256    # More parallelism

# Optimize dependencies but not your code
[profile.dev.package."*"]
opt-level = 2          # Dependencies are optimized (they don't change often)
debug = false

# =============================================================================
# Release Profile - Optimized for size and speed
# =============================================================================
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
