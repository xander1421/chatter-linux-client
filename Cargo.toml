[workspace]
members = [
    "crates/chatter-core",
    "crates/chatter-mesh",
    "crates/chatter-mesh-android",
    "crates/chatter-mesh-ble",
    "crates/chatter-mesh-link",
    "crates/chatter-mesh-noise",
    "crates/chatter-mesh-nostr",
    "crates/chatter-mesh-store",
    "crates/chatter-ui",
    "crates/chatter-ios",
]
# The fuzz crate must NOT be a workspace member — otherwise libfuzzer-sys
# (which requires `-Z sanitizer=address` and a nightly toolchain) gets pulled
# into normal `cargo build` resolution. It lives under chatter-core/fuzz/ and
# is built standalone via `cargo +nightly fuzz run …`.
exclude = ["crates/chatter-core/fuzz"]
resolver = "3"

# android-activity 0.6.1 from crates.io (git main was causing JVM attach failures)

# =============================================================================
# Development Profile - Optimized for fast rebuilds
# =============================================================================
[profile.dev]
opt-level = 0          # No optimization for your code (fast compile)
debug = 0              # No debug symbols (faster linking)
incremental = true     # Incremental compilation
codegen-units = 256    # More parallelism

# chatter-core is opted OUT of the workspace-member opt-level = 0 above.
#
# Why (OPEN-ITEMS §109): attachment crypto is `cbc::Decryptor<aes::Aes256>` --
# a generic, so the AES round function is monomorphised into chatter-core and
# compiled at CHATTER-CORE's opt-level, not the `aes` crate's. At opt-level = 0
# that instantiation runs at ~64 MB/s; at 2 it runs at ~217 MB/s. Nothing about
# the `aes` crate changes -- the same type in a test crate measures ~1600 MB/s
# either way.
#
# It only looked fine before because of a coincidence. With `-Z share-generics=y`
# chatter-core could reuse an instantiation already compiled inside an
# opt-level = 2 dependency, and `signal-crypto` was a second user of cbc 0.1.2
# that provided one. libsignal v0.102.2 moves to aes 0.9 / cbc 0.2, leaving
# chatter-core the sole user of cbc 0.1.2 -- so it emits its own, at opt-level 0,
# and dev-build attachment crypto fell 5x.
#
# Note that `-Z share-generics=y` is NOT set by this repository. It came from the
# developer's ~/.cargo/config.toml, which means dev-build crypto speed here was a
# property of one machine's global cargo config. This line removes that
# dependency: chatter-core is now fast because of this file.
#
# Dev profile only; release is unaffected and measured (§109). Costs ~30s on a
# clean chatter-core build.
[profile.dev.package.chatter-core]
opt-level = 2

# Optimize dependencies but not your code
[profile.dev.package."*"]
opt-level = 2          # Dependencies are optimized (they don't change often)
debug = false

# =============================================================================
# Release Profile - Optimized for size and speed
# =============================================================================
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

# Crypto and attachment processing favour throughput; the rest retains "z".
# Include chatter-core: generic AES-CBC / HMAC code is instantiated there.
# Unversioned package names apply to every locked version of each crate.
[profile.release.package.chatter-core]
opt-level = 3

[profile.release.package.aes]
opt-level = 3

[profile.release.package.aes-gcm]
opt-level = 3

[profile.release.package.cbc]
opt-level = 3

