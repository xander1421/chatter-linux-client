[package]
name = "chatter-linux"
version = "0.1.0"
edition = "2024"
authors = ["xander1421"]
description = "Native Linux client for Chatter - secure messaging"
license = "GPL-3.0"
repository = "https://github.com/xander1421/chatter"
rust-version = "1.85"
default-run = "chatter-linux"

[[bin]]
name = "chatter-linux"
path = "src/main.rs"

[[bin]]
name = "test_thumbnail"
path = "src/bin/test_thumbnail.rs"

[lib]
name = "chatter_linux"
path = "src/lib.rs"

[dependencies]
# ============================================================================
# UI Framework - Slint (cross-platform, mobile-friendly)
# ============================================================================
slint = { version = "1.13", default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-2", "accessibility"] }
i-slint-backend-winit = "1.13"
winit = "0.30"

# ============================================================================
# Async Runtime
# ============================================================================
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }                           # CancellationToken for graceful shutdown
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# ============================================================================
# gRPC (Generated code dependencies)
# ============================================================================
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
tower = "0.5"                                     # Middleware layers (retry, timeout) - used in Phase 21

# ============================================================================
# Crypto - Signal Protocol (Official libsignal)
# ============================================================================
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", branch = "main" }
libsignal-core = { git = "https://github.com/signalapp/libsignal", branch = "main" }
rand = "0.9"
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }  # For ed25519-dalek compatibility
blind-rsa-signatures = "0.14"                     # Chaum RSA blind signatures (RFC 9474)
rsa = "0.7"                                       # RSA public key parsing (matches blind-rsa-signatures 0.14)
sha2 = "0.10"                                     # Auto-detects SHA-NI/ARM SHA2/AVX2
hmac = "0.12"
rayon = "1.10"                                    # Parallel processing for large files
hkdf = "0.12"
aes-gcm = "0.10"
aes = "0.8"                                       # AES-256 block cipher (for CBC mode)
cbc = "0.1"                                       # CBC mode wrapper (Signal-compatible attachments)
block-padding = "0.3"                             # PKCS7/NoPadding support
openssl = { version = "0.10", features = ["vendored"] }  # Hardware-accelerated AES-CBC (vendored for cross-platform builds)
chacha20poly1305 = "0.10"
hpke = "0.12"                                     # RFC 9180 HPKE for NDSS'21 initial contact
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
xeddsa = "1.0"
curve25519-dalek = { version = "4", features = ["digest"] }
subtle = "2.5"  # Constant-time comparison
base64 = "0.22"
base32 = "0.5"                                    # Base32 encoding for private friend codes
hex = "0.4"
qrcode = "0.14"                                   # QR code generation for friend codes

# ============================================================================
# Database (SQLite + SQLCipher)
# ============================================================================
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "unlock_notify", "blob"] }
memmap2 = "0.9"                           # Memory-mapped file I/O for large attachments

# ============================================================================
# System Integration (cross-platform)
# ============================================================================
keyring = { version = "3", features = ["sync-secret-service", "windows-native"] }  # Secret Service on Linux, Credential Manager on Windows
notify-rust = "4"                     # Desktop notifications (works on Windows too)
directories = "6"                     # XDG directories (cross-platform)
dirs = "5"                            # Home directory detection
arboard = "3"                         # Clipboard (cross-platform)

# ============================================================================
# Serialization
# ============================================================================
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# ============================================================================
# Synchronization
# ============================================================================
parking_lot = "0.12"                      # Fast sync primitives (RwLock for interceptors)

# ============================================================================
# Utilities
# ============================================================================
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
bytes = "1"
http = "1"
rfd = "0.15"                              # Native file dialogs
mime_guess = "2"                          # MIME type detection
reqwest = { version = "0.12", features = ["rustls-tls", "json", "blocking"] }  # HTTP client for presigned URLs
open = "5.3.3"
rodio = "0.21.1"
cpal = "0.15"                              # Audio input (recording)
hound = "3.5"                              # WAV encoding
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ringbuf = "0.4"                            # Ring buffer for audio/video sync
smol = "2"                                 # Async runtime for video player

# ============================================================================
# Video Decoding - GStreamer (cross-platform)
# ============================================================================
# GStreamer works on Desktop (Linux/Windows/macOS) AND Mobile (Android/iOS)
# Uses native hardware acceleration on each platform
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
gstreamer-audio = "0.23"
gstreamer-pbutils = "0.23"  # For duration discovery without full decode
gstreamer-gl = "0.23"       # GL texture sharing for zero-copy video
gstreamer-play = "0.23"     # High-level Play API for clean video playback

# ============================================================================
# Media Utilities
# ============================================================================
bytemuck = { version = "1", features = ["derive"] }  # Safe byte casting for audio data
once_cell = "1"                            # Lazy static initialization
zeroize = { version = "1.8", features = ["derive"] }  # Secure memory wiping for sensitive data
libc = "0.2"                               # System calls

# ============================================================================
# WebRTC / LiveKit
# ============================================================================
livekit = { version = "0.7.32", features = ["native-tls"] }
livekit-api = "0.4.14"
lazy_static = "1.5.0"
async-stream = "0.3.6"

# ============================================================================
# Code Viewer Component (syntax highlighting with selection)
# ============================================================================
slint-code-view = { path = "../slint-code-view" }

# ============================================================================
# Local AI (optional - requires CUDA)
# ============================================================================
mistralrs = { version = "0.7", optional = true, features = ["cuda", "flash-attn"] }
unicode-segmentation = "1.12.0"
argon2 = "0.5.3"

# ============================================================================
# Platform-specific: Linux
# ============================================================================
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"                            # D-Bus IPC (Linux only)
ksni = "0.2"                          # System tray StatusNotifierItem (Linux only)
v4l = "0.14"                          # V4L2 webcam capture (Linux only)
gstreamer-gl-egl = "0.23"             # EGL integration for GL video
glutin_egl_sys = "0.7"                # EGL bindings for context sharing

# ============================================================================
# Platform-specific: Windows
# ============================================================================
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_Memory",            # VirtualLock for secure memory
    "Win32_System_Threading",         # GetCurrentProcess for debug detection
    "Win32_System_Diagnostics_Debug", # IsDebuggerPresent, CheckRemoteDebuggerPresent
] }
winreg = "0.55"                       # Windows Registry for autostart
tray-icon = "0.21"                    # Cross-platform system tray
muda = "0.17"                         # Menu for tray icon

# ============================================================================
# Platform-specific: Android
# ============================================================================
[target.'cfg(target_os = "android")'.dependencies]
gstreamer-gl-egl = "0.23"             # EGL integration for GL video
glutin_egl_sys = "0.7"                # EGL bindings for context sharing

[build-dependencies]
slint-build = "1.13"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

# Testing framework
mockall = "0.13"              # Auto-generate mocks from traits
paste = "1.0"                 # Macro utilities for test generation
chrono = "0.4"                # Timestamps in test fixtures

[[bench]]
name = "attachment_decrypt"
harness = false

# =============================================================================
# Development Profile - Optimized for fast rebuilds
# =============================================================================
[profile.dev]
opt-level = 0          # No optimization for your code (fast compile)
debug = 0              # No debug symbols (faster linking)
incremental = true     # Incremental compilation
codegen-units = 256    # More parallelism

# Optimize dependencies but not your code
[profile.dev.package."*"]
opt-level = 2          # Dependencies are optimized (they don't change often)
debug = false

# =============================================================================
# Release Profile - Optimized for size and speed
# =============================================================================
[features]
default = ["local-ai"]
# Local AI - requires CUDA/cuDNN for GPU acceleration
local-ai = ["mistralrs"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
