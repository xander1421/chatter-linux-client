# =============================================================================
# Release-Dev Profile — Optimized binary for perf/RSS testing against the local
# docker-compose dev server.
#
# The sealed-sender trust root is NOT selected by this profile. It used to be:
# `debug-assertions = true` existed solely to keep cfg(debug_assertions) active
# so config.rs would pick the dev trust root, which meant an optimized "release"
# build silently trusted a key whose private half is in this repository. The
# trust root is now the explicit `dev-trust-root` cargo feature — pass
# `--features chatter-core/dev-trust-root` (or chatter-ui/dev-trust-root) when
# pointing this profile at the dev Vault.
# =============================================================================
[profile.release-dev]
inherits = "release"
opt-level = 3
overflow-checks = false
strip = "debuginfo"
lto = "thin"

# Vendored + patched Slint Android backend: dedupe GameTextInput state pushes so
# the IME isn't restarted on every keystroke (fixes dropped keystrokes / input
# lag, slint-ui/slint #9240), and send the IME's text as a committed state
# with its caret instead of a Slint pre-edit, which core 1.17 paints in
# selection colours (androidwindowadapter.rs, game-activity path — the one
# chatter-ui builds). Also paces animation frames on the vsync'd swap instead
# of a hardcoded 10 ms tick (with a floor so it never spins), and votes the
# panel's top refresh rate only while the UI moves.
# See vendor/i-slint-backend-android-activity/PATCHES.md.
[patch.crates-io]
fontique = { path = "vendor/fontique" }
parley = { path = "vendor/parley" }
ndk-context = { path = "vendor/ndk-context" }
# Keep Quinn receive streams accessible during pending HTTP/3 reads.
# See vendor/h3-quinn/PATCHES.md.
h3-quinn = { path = "vendor/h3-quinn" }
# Locked LiveKit media sender key-index lifecycle patch; see vendor/livekit/PATCHES.md.
livekit = { path = "vendor/livekit" }
# Explicit private-PKI signaling connector; see vendor/livekit-api/PATCHES.md.
livekit-api = { path = "vendor/livekit-api" }
# Stop an AAudio stream before closing it (Android 10 abort); see vendor/cpal/PATCHES.md.
cpal = { path = "vendor/cpal" }
i-slint-backend-android-activity = { path = "vendor/i-slint-backend-android-activity" }
# AccessKit focus change during an accessibility action; see vendor/i-slint-backend-winit/PATCHES.md.
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }

# Slint 1.18.1 Backdrop builtin and Skia backdrop image filters.
i-slint-compiler = { path = "vendor/i-slint-compiler" }
i-slint-core = { path = "vendor/i-slint-core" }
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }
