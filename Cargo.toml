[workspace]
members = [
    "crates/chatter-attachment-crypto",
    "crates/chatter-core",
    "crates/chatter-i18n",
    "crates/chatter-mesh",
    "crates/chatter-mesh-android",
    "crates/chatter-mesh-ble",
    "crates/chatter-mesh-link",
    "crates/chatter-mesh-noise",
    "crates/chatter-mesh-nostr",
    "crates/chatter-mesh-store",
    "crates/chatter-proto",
    "crates/chatter-ui",
    "crates/chatter-ui-slint",
    "crates/chatter-ios",
]
# The fuzz crate must NOT be a workspace member — otherwise libfuzzer-sys
# (which requires `-Z sanitizer=address` and a nightly toolchain) gets pulled
# into normal `cargo build` resolution. It lives under chatter-core/fuzz/ and
# is built standalone via `cargo +nightly fuzz run …`.
exclude = ["crates/chatter-core/fuzz"]
resolver = "3"

# chatter-core keeps its own `version = "0.1.0"`: its CARGO_PKG_VERSION is the
# updater's fallback current version (chatter-core/src/update.rs) and goes into
# the link-device user agent. Every other member inherits this one.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"

# Shared dependency versions. Features stay in each member's manifest.
[workspace.dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", rev = "e5ca0e0b1c55ccf675c47dee636e02337c487356" }
libsignal-core = { git = "https://github.com/signalapp/libsignal", rev = "e5ca0e0b1c55ccf675c47dee636e02337c487356" }
zkgroup = { git = "https://github.com/signalapp/libsignal", rev = "e5ca0e0b1c55ccf675c47dee636e02337c487356" }
libsignal-keytrans = { git = "https://github.com/signalapp/libsignal", rev = "e5ca0e0b1c55ccf675c47dee636e02337c487356" }
signal-crypto = { git = "https://github.com/signalapp/libsignal", rev = "e5ca0e0b1c55ccf675c47dee636e02337c487356" }
signal-media = { git = "https://github.com/signalapp/libsignal", rev = "e5ca0e0b1c55ccf675c47dee636e02337c487356" }
usernames = { git = "https://github.com/signalapp/libsignal", rev = "e5ca0e0b1c55ccf675c47dee636e02337c487356" }
tokio = "1.53.3"
futures = "0.3"
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
serde = "1"
serde_json = "1"
thiserror = "2"
sha2 = "0.11.0"
hex = "0.4"
uuid = "1"
chrono = "0.4"
tracing = "0.1"
zeroize = "1.8"
rand = "0.10.3"
rand_core = "0.10.1"

# No lints are configured in any manifest or rustflags today; per-crate
# `#![forbid(...)]` attributes stay in the crates' lib.rs.
[workspace.lints]

# android-activity 0.6.1 from crates.io (git main was causing JVM attach failures)

# =============================================================================
# Development Profile - Optimized for fast rebuilds
# =============================================================================
[profile.dev]
opt-level = 0          # No optimization for your code (fast compile)
debug = 0              # No debug symbols (faster linking)
incremental = true     # Incremental compilation
codegen-units = 256    # More parallelism

# chatter-ui-slint keeps O0, and that is measured, not an
# oversight (OPEN-ITEMS §101, 2026-10-04). It is a workspace member, so the
# `"*"` opt-level = 2 below never applied to it: it already builds at O0 with
# debug = 0. Its rustc compiles ~50 MB of generated Rust for one edited .slint
# file: ~117 s, 8.9 GB peak RSS. Per-crate settings tried, edit-one-.slint
# rebuilds of that crate (±5 s noise):
#   codegen-units 16 / 64           111 s / 113 s, 8.8-8.9 GB  (no change)
#   debug-assertions + overflow off 108 s, 8.9 GB              (noise-level)
#   opt-level = 1                   285 s, 11.1 GB             (much worse)
#   incremental (no sccache)        58-123 s, 7.0-13.2 GB      (erratic; sccache forbids it)
#   -Zthreads=8 (nightly rustc)     75 s, 9.2 GB               (-36% wall)
# Only -Zthreads helps. Keep this machine-specific experimental tuning opt-in
# even with the dated nightly pin; see §101.

# Keep the generated UI non-incremental to bound memory and allow sccache reuse.
# Other workspace crates inherit incremental = true above.
[profile.dev.package.chatter-ui-slint]
incremental = false

# chatter-attachment-crypto is opted OUT of the workspace-member opt-level = 0
# above. chatter-core is not: it builds at O0 like every other member.
#
# Why (OPEN-ITEMS §109): attachment crypto is `cbc::Decryptor<aes::Aes256>` --
# a generic, so the AES round function is monomorphised into the crate that
# instantiates it and compiled at THAT crate's opt-level, not the `aes`
# crate's. At opt-level = 0 that instantiation ran at ~64 MB/s; at 2, ~217 MB/s
# (both measured when it lived in chatter-core). Nothing about the `aes` crate
# changes -- the same type in a test crate measures ~1600 MB/s either way.
#
# It only looked fine before because of a coincidence. With `-Z share-generics=y`
# chatter-core could reuse an instantiation already compiled inside an
# opt-level = 2 dependency, and `signal-crypto` was a second user of cbc 0.1.2
# that provided one. libsignal v0.102.2 moves to aes 0.9 / cbc 0.2, leaving
# chatter-core the sole user of cbc 0.1.2 -- so it emitted its own, at opt-level
# 0, and dev-build attachment crypto fell 5x.
#
# Note that `-Z share-generics=y` is NOT set by this repository. It came from the
# developer's ~/.cargo/config.toml, which means dev-build crypto speed here was a
# property of one machine's global cargo config. This line removes that
# dependency.
#
# chatter-core used to carry this opt-level = 2 itself. The attachment AES-CBC +
# HMAC code (and the AES block loop of the range decryptor) now lives in
# chatter-attachment-crypto behind non-generic functions, so the instantiation
# happens there and chatter-core can build at O0. Other AES users that remain in
# chatter-core (backup `Aes256Gcm`, provisioning, profile/device-name crypto)
# now run at O0 in dev; not re-measured.
#
# Dev profile only; release is set separately below.
[profile.dev.package.chatter-attachment-crypto]
opt-level = 2

# Optimize dependencies but not your code
[profile.dev.package."*"]
opt-level = 2          # Dependencies are optimized (they don't change often)
debug = false

# =============================================================================
# Release Profile - Optimized for size and speed
# =============================================================================
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

# Crypto and attachment processing favour throughput; the rest retains "z".
# Include chatter-attachment-crypto, where the generic AES-CBC / HMAC code is
# instantiated, and chatter-core (services, Signal paths, backup Aes256Gcm).
# Unversioned package names apply to every locked version of each crate.
[profile.release.package.chatter-core]
opt-level = 3

[profile.release.package.chatter-attachment-crypto]
opt-level = 3

