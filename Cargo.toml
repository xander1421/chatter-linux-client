[package]
name = "chatter-linux"
version = "0.1.0"
edition = "2024"
authors = ["xander1421"]
description = "Native Linux client for Chatter - secure messaging"
license = "GPL-3.0"
repository = "https://github.com/xander1421/chatter"
rust-version = "1.85"
default-run = "chatter-linux"

[[bin]]
name = "chatter-linux"
path = "src/main.rs"

[lib]
name = "chatter_linux"
path = "src/lib.rs"

[dependencies]
# ============================================================================
# UI Framework - Slint (cross-platform, mobile-friendly)
# ============================================================================
slint = { version = "1.15.1", default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-2", "accessibility"] }

# ============================================================================
# Async Runtime
# ============================================================================
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# ============================================================================
# gRPC (Generated code dependencies)
# ============================================================================
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
tower = "0.5"                                     # Middleware layers (retry, timeout) - used in Phase 21

# ============================================================================
# Crypto - Signal Protocol (Official libsignal)
# ============================================================================
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", branch = "main" }
libsignal-core = { git = "https://github.com/signalapp/libsignal", branch = "main" }
rand = "0.9"
blind-rsa-signatures = "0.14"                     # Chaum RSA blind signatures (RFC 9474)
rsa = "0.7"                                       # RSA public key parsing (matches blind-rsa-signatures 0.14)
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
aes = "0.8"                                       # AES-256 block cipher (for CBC mode)
cbc = "0.1"                                       # CBC mode wrapper (Signal-compatible attachments)
block-padding = "0.3"                             # PKCS7/NoPadding support
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
xeddsa = "1.0"
curve25519-dalek = { version = "4", features = ["digest"] }
subtle = "2.5"  # Constant-time comparison
base64 = "0.22"
hex = "0.4"


# ============================================================================
# Database (SQLite + SQLCipher)
# ============================================================================
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "unlock_notify"] }

# ============================================================================
# System Integration (D-Bus)
# ============================================================================
zbus = "5"                            # Modern D-Bus library
keyring = { version = "3", features = ["sync-secret-service"] }  # Cross-platform secure credential storage (DBus Secret Service on Linux)
notify-rust = "4"                     # Desktop notifications
ksni = "0.2"                          # System tray (StatusNotifierItem)
directories = "6"                     # XDG directories
dirs = "5"                            # Home directory detection
arboard = { version = "3", features = ["wayland-data-control"] }  # Clipboard with Wayland support

# ============================================================================
# Serialization
# ============================================================================
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ============================================================================
# Synchronization
# ============================================================================
parking_lot = "0.12"                      # Fast sync primitives (RwLock for interceptors)

# ============================================================================
# Utilities
# ============================================================================
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
http = "1"
rfd = "0.15"                              # Native file dialogs
mime_guess = "2"                          # MIME type detection
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }  # HTTP client for presigned URLs
open = "5.3.3"
rodio = "0.21.1"
cpal = "0.15"                              # Audio input (recording)
hound = "3.5"                              # WAV encoding
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ringbuf = "0.4"                            # Ring buffer for audio/video sync
smol = "2"                                 # Async runtime for video player

# ============================================================================
# Video Decoding - Platform Native
# ============================================================================
# Linux: GStreamer (native multimedia framework)
# No symbol conflicts with libwebrtc - clean separation
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
gstreamer-audio = "0.23"
gstreamer-pbutils = "0.23"  # For duration discovery without full decode

# ============================================================================
# Media Utilities
# ============================================================================
bytemuck = "1"                             # Safe byte casting for audio samples
v4l = "0.14"                              # V4L2 webcam capture (Linux)
once_cell = "1"                            # Lazy static initialization
zeroize = { version = "1.8", features = ["derive"] }  # Secure memory wiping for sensitive data
libc = "0.2"                               # System calls for memfd (secure in-memory files)

# ============================================================================
# WebRTC / LiveKit
# ============================================================================
livekit = { version = "0.7.32", features = ["native-tls"] }
livekit-api = "0.4.14"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }  # Syntax highlighting (pure Rust)
lazy_static = "1.5.0"
async-stream = "0.3.6"

[build-dependencies]
slint-build = "1.15.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
