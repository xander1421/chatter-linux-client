[package]
name = "chatter-core"
version = "0.1.0"
edition = "2024"
authors = ["xander1421"]
description = "Core library for Chatter secure messaging"
license = "GPL-3.0"
repository = "https://github.com/xander1421/chatter"
rust-version = "1.85"

[lib]
name = "chatter_core"
path = "src/lib.rs"

[dependencies]
# ============================================================================
# Async Runtime
# ============================================================================
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "net", "fs"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# ============================================================================
# gRPC (Generated code dependencies)
# ============================================================================
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
tower = "0.5"

# ============================================================================
# Crypto - Signal Protocol (Official libsignal)
# ============================================================================
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", branch = "main" }
libsignal-core = { git = "https://github.com/signalapp/libsignal", branch = "main" }
rand = "0.9"
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
blind-rsa-signatures = "0.14"
rsa = "0.7"
sha2 = "0.10"
hmac = "0.12"
rayon = "1.10"
hkdf = "0.12"
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
block-padding = "0.3"
openssl = "0.10"
chacha20poly1305 = "0.10"
hpke = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
xeddsa = "1.0"
curve25519-dalek = { version = "4", features = ["digest"] }
subtle = "2.5"
base64 = "0.22"
base32 = "0.5"
hex = "0.4"
qrcode = "0.14"

# ============================================================================
# Database (SQLite + SQLCipher)
# ============================================================================
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "unlock_notify", "blob"] }
memmap2 = "0.9"

# ============================================================================
# System Integration (cross-platform)
# ============================================================================
keyring = { version = "3", default-features = false }
directories = "6"
dirs = "5"

# ============================================================================
# Serialization
# ============================================================================
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# ============================================================================
# Synchronization
# ============================================================================
parking_lot = "0.12"

# ============================================================================
# Utilities
# ============================================================================
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
bytes = "1"
http = "1"
mime_guess = "2"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "blocking", "stream"] }
rodio = "0.21.1"
cpal = "0.15"
hound = "3.5"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ringbuf = "0.4"
# smol removed — was unused

# ============================================================================
# Video Decoding - GStreamer (cross-platform)
# ============================================================================
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
gstreamer-audio = "0.23"
gstreamer-pbutils = "0.23"
gstreamer-gl = "0.23"
gstreamer-play = "0.23"

# ============================================================================
# Media Utilities
# ============================================================================
bytemuck = { version = "1", features = ["derive"] }
# once_cell removed — migrated to std::sync::LazyLock
zeroize = { version = "1.8", features = ["derive"] }
libc = "0.2"

# ============================================================================
# WebRTC / LiveKit
# ============================================================================
livekit = { version = "0.7.32", features = ["native-tls"] }
livekit-api = "0.4.14"
# lazy_static removed — migrated to std::sync::LazyLock
async-stream = "0.3.6"

# ============================================================================
# Local AI (optional - requires CUDA)
# ============================================================================
mistralrs = { version = "0.7", optional = true, features = ["cuda", "flash-attn"] }
unicode-segmentation = "1.12.0"
argon2 = "0.5.3"
tempfile = "3"

# ============================================================================
# Desktop-only system deps (not available on Android)
# ============================================================================
[target.'cfg(not(target_os = "android"))'.dependencies]
notify-rust = "4"
arboard = { version = "3", features = ["wayland-data-control"] }
rfd = "0.15"
open = "5.3.3"

# ============================================================================
# Platform-specific: Linux
# ============================================================================
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
ksni = "0.2"
v4l = "0.14"
gstreamer-gl-egl = "0.23"
glutin_egl_sys = "0.7"

# ============================================================================
# Platform-specific: Windows
# ============================================================================
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
] }
winreg = "0.55"
tray-icon = "0.21"
muda = "0.17"

# ============================================================================
# Platform-specific: Android
# ============================================================================
[target.'cfg(target_os = "android")'.dependencies]
gstreamer-gl-egl = "0.23"
glutin_egl_sys = "0.7"
jni = "0.21"           # JNI bindings for Android system APIs (notifications, etc.)
ndk-context = "0.1"    # Access to Android app context (JNI VM + activity)

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
mockall = "0.13"
paste = "1.0"
chrono = "0.4"

[[bench]]
name = "attachment_decrypt"
harness = false

[features]
default = ["desktop-system"]
desktop-system = ["keyring/sync-secret-service", "keyring/windows-native"]
local-ai = ["dep:mistralrs"]
