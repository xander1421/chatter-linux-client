[package]
name = "chatter-core"
version = "0.1.0"
edition = "2024"
authors = ["xander1421"]
description = "Core library for Chatter secure messaging"
license = "GPL-3.0"
repository = "https://github.com/xander1421/chatter"
rust-version = "1.85"

[lib]
name = "chatter_core"
path = "src/lib.rs"

[dependencies]
# ============================================================================
# Async Runtime
# ============================================================================
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "net", "fs"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# ============================================================================
# gRPC (Generated code dependencies)
# ============================================================================
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
tower = "0.5"

# ============================================================================
# Crypto - Signal Protocol (Official libsignal)
# ============================================================================
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", rev = "c5edd3fa38bf5f13bc70a88c146cfbdd61865fe3" }
libsignal-core = { git = "https://github.com/signalapp/libsignal", rev = "c5edd3fa38bf5f13bc70a88c146cfbdd61865fe3" }
# Signal usernames crate (Ristretto255 + ZK proof of ownership for the
# discovery hash). NOTE: licensed AGPL-3.0; combining with the rest of
# chatter (GPL-3.0) means the combined work is effectively AGPL.
usernames = { git = "https://github.com/signalapp/libsignal", rev = "c5edd3fa38bf5f13bc70a88c146cfbdd61865fe3" }
rand = { version = "0.9", features = ["os_rng"] }
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
blind-rsa-signatures = "0.14"
rsa = "0.7"
sha2 = "0.10"
hmac = "0.12"
rayon = "1.10"
hkdf = "0.12"
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
block-padding = "0.3"
chacha20poly1305 = "0.10"
hpke = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
xeddsa = "1.0"
curve25519-dalek = { version = "4", features = ["digest"] }
subtle = "2.5"
base64 = "0.22"
base32 = "0.5"
hex = "0.4"
qrcode = "0.14"

# ============================================================================
# Database (SQLite + SQLCipher)
# ============================================================================
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "unlock_notify", "blob"] }
memmap2 = "0.9"

# ============================================================================
# System Integration (cross-platform)
# ============================================================================
keyring = { version = "3", default-features = false }
directories = "6"
dirs = "5"

# ============================================================================
# Serialization
# ============================================================================
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# ============================================================================
# Synchronization
# ============================================================================
parking_lot = "0.12"

# ============================================================================
# Utilities
# ============================================================================
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
bytes = "1"
http = "1"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "stream", "charset", "http2", "macos-system-configuration"] }
url = "2"
rodio = "0.21.1"
cpal = "0.15"
hound = "3.5"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ringbuf = "0.4"
# smol removed — was unused

# ============================================================================
# Video Decoding - GStreamer (desktop only, gated behind `desktop-media`)
# ============================================================================
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }
gstreamer-video = { version = "0.23", optional = true }
gstreamer-audio = { version = "0.23", optional = true }
gstreamer-pbutils = { version = "0.23", optional = true }
gstreamer-gl = { version = "0.23", optional = true }
gstreamer-play = { version = "0.23", optional = true }

# ============================================================================
# Media Utilities
# ============================================================================
bytemuck = { version = "1", features = ["derive"] }
# once_cell removed — migrated to std::sync::LazyLock
moka = { version = "0.12", features = ["sync"] }
zeroize = { version = "1.8", features = ["derive"] }
libc = "0.2"

# ============================================================================
# WebRTC / LiveKit (desktop only, gated behind `desktop-media`)
# ============================================================================
livekit = { git = "https://github.com/livekit/rust-sdks", rev = "a7f72696c69a7a0cf2b537857f37e8a5f20b2af0", default-features = false, features = ["tokio", "rustls-tls-webpki-roots"], optional = true }
livekit-api = { git = "https://github.com/livekit/rust-sdks", rev = "a7f72696c69a7a0cf2b537857f37e8a5f20b2af0", default-features = false, features = ["services-tokio", "access-token", "webhooks", "signal-client-tokio", "rustls-tls-webpki-roots"], optional = true }
# lazy_static removed — migrated to std::sync::LazyLock
async-stream = "0.3.6"

# ============================================================================
# Local AI (optional - requires CUDA)
# ============================================================================
mistralrs = { version = "0.7", optional = true, features = ["cuda", "flash-attn"] }
unicode-segmentation = "1.12.0"
argon2 = "0.5.3"
tempfile = "3"

# ============================================================================
# Desktop-only system deps (not available on Android)
# ============================================================================
[target.'cfg(not(target_os = "android"))'.dependencies]
notify-rust = "4"
arboard = { version = "3", features = ["wayland-data-control"] }
# gtk3 backend (in-process GtkFileChooserDialog) instead of the xdg-portal
# default. Hyprland and other wlroots-derived compositors removed
# `xdg_foreign`, which makes the portal FileChooser hang waiting for a
# parent surface that can never be exported. gtk3 dialogs sidestep that.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
open = "5.3.3"

# ============================================================================
# Platform-specific: Linux
# ============================================================================
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
ksni = "0.2"
v4l = "0.14"
gstreamer-gl-egl = { version = "0.23", optional = true }
glutin_egl_sys = { version = "0.7", optional = true }

# ============================================================================
# Platform-specific: Windows
# ============================================================================
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
] }
winreg = "0.55"
tray-icon = "0.21"
muda = "0.17"

# ============================================================================
# Platform-specific: Android
# ============================================================================
# Android platform integration (JNI, ndk-context) lives in chatter-ui, not core.
# Core is platform-neutral; UI crate injects platform impls via NotificationSink.
[target.'cfg(target_os = "android")'.dependencies]
gstreamer-gl-egl = { version = "0.23", optional = true }
glutin_egl_sys = { version = "0.7", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
mockall = "0.13"
paste = "1.0"
proptest = "1"

[[bench]]
name = "attachment_decrypt"
harness = false

[features]
default = ["desktop-system", "desktop-media"]
desktop-system = ["keyring/sync-secret-service", "keyring/windows-native"]
# Shared media stack (LiveKit + WebRTC) — works on every target the `livekit`
# crate supports. Mobile bridges opt in via `--features media`; desktop pulls
# it in transitively through `desktop-media`.
media = [
    "dep:livekit", "dep:livekit-api",
]
# GStreamer — inline video playback, avatar decode, etc. Desktop-only.
desktop-gstreamer = [
    "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video",
    "dep:gstreamer-audio", "dep:gstreamer-pbutils", "dep:gstreamer-gl",
    "dep:gstreamer-play", "dep:gstreamer-gl-egl", "dep:glutin_egl_sys",
]
# Compat alias — previous callers (desktop-cli, chatter-ui) keep working.
desktop-media = ["media", "desktop-gstreamer"]
local-ai = ["dep:mistralrs"]
jarvis = []
# Widens `ChatterClient` service accessors to `pub` so integration tests in
# this crate's `tests/` directory (which are external consumers) can wire
# real services against a live server. Do NOT enable for application builds —
# chatter-ui must stay behind the façade.
testing = []

[package.metadata.docs.rs]
# Enable the `testing` feature in generated docs so accessors appear.
features = ["testing"]
