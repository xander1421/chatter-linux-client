[package]
name = "chatter-attachment-crypto"
version = "0.1.0"
edition = "2024"
authors = ["xander1421"]
description = "Signal-compatible attachment crypto (AES-256-CBC + HMAC-SHA256) for Chatter"
license = "GPL-3.0"
repository = "https://github.com/xander1421/chatter"
rust-version = "1.99"

[lib]
name = "chatter_attachment_crypto"
path = "src/lib.rs"

[features]
# Exposes `override_max_attachment_size` to chatter-core's own unit tests.
test-support = []

[dependencies]
aes = { version = "0.9.3", features = ["zeroize"] }
# `alloc` gives cipher's decrypt_padded_vec (attachment_crypto.rs).
cbc = { version = "0.2.1", features = ["alloc", "zeroize"] }
sha2 = "0.11.0"
hmac = "0.13.0"
subtle = "2.5"
zeroize = { version = "1.8", features = ["derive"] }
rand = { version = "0.9", features = ["os_rng"] }
rayon = "1.10"
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
