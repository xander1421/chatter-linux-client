[package]
name = "chatter-ios"
version.workspace = true
edition.workspace = true
description = "iOS staticlib entry point — links the Rust side into the Xcode app target"
publish = false

[lib]
name = "chatter_ios"
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
chatter-core = { path = "../chatter-core", default-features = false, features = ["ios"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# chatter-ui is optional so the shell still builds+installs while the
# Slint UI's iOS port is in progress. Drop the flag once `ui` builds clean.
chatter-ui = { path = "../chatter-ui", default-features = false, features = ["ios"], optional = true }

[features]
default = []
ui = ["dep:chatter-ui"]

[lints]
workspace = true
