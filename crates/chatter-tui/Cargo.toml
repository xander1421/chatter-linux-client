[package]
name = "chatter-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for Chatter secure messaging"
license = "GPL-3.0"

[[bin]]
name = "chatter-tui"
path = "src/main.rs"

[dependencies]
chatter-core = { path = "../chatter-core" }
tokio = { version = "1", features = ["full"] }
ratatui = "0.28"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
