[package]
name = "chatter-ui"
version = "0.1.0"
edition = "2024"
authors = ["xander1421"]
description = "Slint UI for Chatter secure messaging"
license = "GPL-3.0"
repository = "https://github.com/xander1421/chatter"
rust-version = "1.92"
default-run = "chatter-ui"

[lib]
name = "chatter_ui"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "chatter-ui"
path = "src/main.rs"

[[bin]]
name = "test_thumbnail"
path = "src/bin/test_thumbnail.rs"
required-features = ["desktop-media"]

[[example]]
name = "video_present_bench"
path = "examples/video_present_bench.rs"
required-features = ["desktop"]

[dependencies]
chatter-core = { path = "../chatter-core", default-features = false }

# ============================================================================
# UI Framework - Slint
# ============================================================================
slint = { version = "1.17.1", default-features = false, features = ["compat-1-2", "accessibility", "raw-window-handle-06"] }
i-slint-backend-winit = { version = "1.17.1", optional = true }
winit = { version = "0.30", optional = true }

# ============================================================================
# Shared runtime deps (needed directly by the binary)
# ============================================================================
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "io-util", "net", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }
gstreamer-video = { version = "0.23", optional = true }
gstreamer-gl = { version = "0.23", optional = true }
livekit = { version = "0.7.52", default-features = false, features = ["tokio", "rustls-tls-webpki-roots"], optional = true }
rand = "0.9"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pdfium-render = { version = "0.9", optional = true }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
serde_json = "1"
base64 = "0.22"
mime_guess = "2"
# once_cell + lazy_static removed — migrated to std::sync::LazyLock
zeroize = { version = "1.8", features = ["derive"] }
open = "5"
arboard = { version = "3", features = ["wayland-data-control"], optional = true }

# ============================================================================
# Platform-specific: Linux (GL video rendering)
# ============================================================================
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer-gl-egl = { version = "0.23", optional = true }
glutin_egl_sys = { version = "0.7", optional = true }

# ============================================================================
# Platform-specific: macOS (unified/transparent titlebar)
# ============================================================================
[target.'cfg(target_os = "macos")'.dependencies]
# winit's WindowExtMacOS doesn't expose titlebar transparency or full-size-content-view
# (checked: no such methods on that trait) — only raw NSWindow access gets us the
# native unified-toolbar look every macOS chat app uses. objc2-app-kit is already
# in the dependency graph transitively (winit's macOS backend is built on it), so
# this doesn't add a new crate family, just a direct edge to one already present.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSResponder", "NSView"], optional = true }
objc2-foundation = { version = "0.3", optional = true }
raw-window-handle = { version = "0.6", optional = true }

# ============================================================================
# Platform-specific: Android
# ============================================================================
[target.'cfg(target_os = "android")'.dependencies]
i-slint-backend-android-activity = { version = "1.17.1", default-features = false, features = ["aa-06", "game-activity"], optional = true }
android-activity = { version = "0.6", features = ["game-activity"], optional = true }
# Slint's backend-selector unconditionally references i_slint_backend_android_activity
# on android (api.rs uses `cfg!(...)`, which still compiles the reference). The only
# slint umbrella feature that links it (`backend-android-activity-06`) also force-enables
# `native-activity`, conflicting with game-activity. So we enable the selector's
# `backend-android-activity` feature directly here — it pulls the backend crate with
# default-features=false, letting our game-activity selection above stand alone.
i-slint-backend-selector = { version = "1.17.1", default-features = false, optional = true }
# JNI bindings for Android system APIs (notifications, window insets).
# These live in chatter-ui (platform layer), not chatter-core (platform-neutral).
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
tempfile = "3"
# Headless GUI test backend for VALIDATED-UI.md (slint::testing analog).
# Pinned to =1.17.1 to match the `slint` crate exactly — the testing backend
# links i-slint-core, which must be the SAME version as the generated MainWindow's
# i-slint-core or ElementHandle/Window types won't line up. default-features=false
# keeps it lean (no mcp/protobuf/system-testing pulled in).
i-slint-backend-testing = { version = "=1.17.1", default-features = false }

[build-dependencies]
slint-build = "1.17.1"
# Android calls: force-keep + export the libwebrtc Java_* JNI symbols so the
# bundled livekit.org.webrtc Java classes resolve their native methods (else the
# linker dead-strips them and calls abort with UnsatisfiedLinkError on join).
# Version must match the webrtc-sys that livekit pulls (see Cargo.lock).
webrtc-sys-build = "0.3.16"

[features]
default = ["desktop", "jarvis"]
# The bitchat mesh. Off by default while the radio stack is unproven against a
# second device. `mesh` alone gives BLE; add `onion` for geohash channels and
# Nostr DMs, which are Tor-only on purpose.
mesh = ["chatter-core/mesh"]
desktop = [
    "dep:i-slint-backend-winit", "dep:winit", "dep:arboard", "slint/backend-winit",
    "slint/renderer-skia", "chatter-core/desktop-system", "chatter-core/desktop-media",
    "dep:pdfium-render", "desktop-media",
    "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:raw-window-handle"
]
# windows-cross: No LiveKit (webrtc-sys requires MSVC, can't cross-compile with MinGW).
# GStreamer still links (unconditional dep in chatter-ui). For full features, build
# natively on Windows with the 'desktop' feature.
# windows-cross: GStreamer only, no LiveKit (webrtc-sys requires MSVC, can't cross-compile
# with MinGW). For full features including calls, build natively on Windows.
windows-cross = [
    "dep:i-slint-backend-winit", "dep:winit", "dep:arboard", "slint/backend-winit",
    "slint/renderer-software", "chatter-core/desktop-system", "chatter-core/desktop-gstreamer",
    "desktop-media-no-livekit"
]
desktop-media = [
    "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:gstreamer-gl",
    "dep:livekit", "dep:gstreamer-gl-egl", "dep:glutin_egl_sys",
    "call-ui"
]
# Call UI wiring (features/calls, call event routing, video-frame→image). Enabled
# by both desktop (desktop-media) and mobile so the call screens are actually
# driven on both. The Slint call screens themselves compile unconditionally; this
# only gates the Rust glue. gstreamer-init stays desktop-media-only (lib.rs).
call-ui = []
desktop-media-no-livekit = [
    "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:gstreamer-gl",
    "dep:gstreamer-gl-egl", "dep:glutin_egl_sys"
]
local-ai = ["chatter-core/local-ai"]
jarvis = ["chatter-core/jarvis"]
# The create-channel "AI assistant" template. OFF by default: nothing on that
# path can supply the provider API key the server requires unconditionally
# (internal/services/ai/providers/factory.go:85), so the integration is never
# created and the channel comes up with no bot in it. Mirrored into
# `AiIntegrationGlobal.channel-template-enabled` (lib.rs) so the control is not
# rendered at all. See docs/OPEN-ITEMS.md §58 (FEAT-5).
ai-channel-template = []
# Build against the local dev Vault's sealed-sender trust root. Insecure by
# construction (its private key is in this repo) — see chatter-core/config.rs.
dev-trust-root = ["chatter-core/dev-trust-root"]
# Auto-register a throwaway account on first launch with fixed, publicly-known
# credentials (lib.rs `dev_auto_register`). Insecure by construction, same as
# dev-trust-root: it is an explicit opt-in feature and NOT in `default`, so the
# credential literals are compiled out of every build that does not ask for it.
# This was previously a runtime `cfg!(target_os = "android")` test, which meant
# release APKs auto-registered too. Enabled by dev-run.sh and, on the debug path
# only, android/build-android.sh.
dev-auto-register = []
# Route the network transport over Tor for anon mode. Forwards to chatter-core,
# which owns the onion connector. See docs/ONION_DEPLOYMENT.md §8.3.
onion = ["chatter-core/onion"]
# HTTP/3 (QUIC) gRPC transport, probed and preferred over TCP/HTTP2 when the
# server supports it. Forwards to chatter-core, which owns GrpcTransport.
quic = ["chatter-core/quic"]
# NOTE: deliberately NOT pulling `slint/backend-android-activity-06` — that
# umbrella feature hard-enables `i-slint-backend-android-activity/native-activity`,
# which is mutually exclusive with `game-activity`. We select the backend +
# game-activity directly on the dep above, and `android_main` sets the platform
# manually via `AndroidPlatform::new(app)` (no slint backend-selector needed).
# dep:livekit so android_main can call livekit::webrtc::android::initialize_android
# (webrtc needs the JavaVM wired before Room::connect, or it segfaults on join).
mobile = ["dep:i-slint-backend-android-activity", "dep:android-activity", "i-slint-backend-selector/backend-android-activity", "slint/std", "chatter-core/media", "call-ui", "dep:livekit"]
# iOS: leanest possible set. winit backend (i-slint-backend-winit 1.17 declares
# objc2-ui-kit/objc2-quartz-core/block2 for iOS) and the same skia renderer
# desktop uses — it cross-compiles and links for aarch64-apple-ios and renders
# correctly on device. No livekit, no gstreamer, no arboard, no pdfium.
ios = ["dep:i-slint-backend-winit", "dep:winit", "slint/backend-winit", "slint/renderer-skia", "slint/std", "chatter-core/ios"]

# =============================================================================
# Android Metadata (for cargo-apk)
# =============================================================================
[package.metadata.android]
package = "com.chatter.client"
label = "Chatter"
icon = "../../assets/icon-512.png"
min_sdk_version = 26
target_sdk_version = 34
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"
[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"
[[package.metadata.android.uses_permission]]
name = "android.permission.MODIFY_AUDIO_SETTINGS"
[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"
[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"
[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[[package.metadata.android.activity]]
config_changes = "orientation|screenSize|keyboardHidden"
# adjustResize is what Slint's Android backend expects: it fires the
# WindowInsetsAnimationCallback / OnGlobalLayoutListener that populates
# `Window.safe-area-insets` and `virtual-keyboard-size`. We no longer do our
# own JNI inset polling, so the manifest must match Slint's default.
window_soft_input_mode = "adjustResize"

# Release signing — for local dev builds we reuse Android's debug keystore
# (same one Android Studio uses). Production release builds should replace this
# with a proper keystore and password. The device trusts this signature for
# testing; the Play Store rejects APKs signed with it.
[package.metadata.android.signing.release]
path = "/home/alex/.android/debug.keystore"
keystore_password = "android"
