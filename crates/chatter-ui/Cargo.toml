[package]
name = "chatter-ui"
version = "0.1.0"
edition = "2024"
authors = ["xander1421"]
description = "Slint UI for Chatter secure messaging"
license = "GPL-3.0"
repository = "https://github.com/xander1421/chatter"
rust-version = "1.85"
default-run = "chatter-ui"

[lib]
name = "chatter_ui"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "chatter-ui"
path = "src/main.rs"

[[bin]]
name = "test_thumbnail"
path = "src/bin/test_thumbnail.rs"

[dependencies]
chatter-core = { path = "../chatter-core", default-features = false }

# ============================================================================
# UI Framework - Slint
# ============================================================================
slint = { version = "1.15.1", default-features = false, features = ["compat-1-2", "accessibility"] }
i-slint-backend-winit = { version = "1.15.1", optional = true }
winit = { version = "0.30", optional = true }

# ============================================================================
# Shared runtime deps (needed directly by the binary)
# ============================================================================
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "io-util", "net", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }
gstreamer-video = { version = "0.23", optional = true }
gstreamer-gl = { version = "0.23", optional = true }
livekit = { version = "0.7.32", features = ["native-tls"], optional = true }
livekit-api = { version = "0.4.14", optional = true }
rand = "0.9"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pdfium-render = { version = "0.9", optional = true }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
serde_json = "1"
base64 = "0.22"
prost = "0.13"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "blocking"] }
mime_guess = "2"
# once_cell + lazy_static removed — migrated to std::sync::LazyLock
zeroize = { version = "1.8", features = ["derive"] }
open = "5"
arboard = { version = "3", features = ["wayland-data-control"], optional = true }

# ============================================================================
# Platform-specific: Linux (GL video rendering)
# ============================================================================
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer-gl-egl = { version = "0.23", optional = true }
glutin_egl_sys = { version = "0.7", optional = true }

# ============================================================================
# Platform-specific: Android
# ============================================================================
[target.'cfg(target_os = "android")'.dependencies]
i-slint-backend-android-activity = { version = "1.15.1", default-features = false, features = ["aa-06"], optional = true }
android-activity = { version = "0.6", features = ["native-activity"], optional = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1.15.1"

[features]
default = ["desktop"]
desktop = [
    "dep:i-slint-backend-winit", "dep:winit", "dep:arboard", "slint/backend-winit", 
    "slint/renderer-skia", "chatter-core/desktop-system", "chatter-core/desktop-media", 
    "dep:pdfium-render", "desktop-media"
]
# windows-cross: No LiveKit (webrtc-sys requires MSVC, can't cross-compile with MinGW).
# GStreamer still links (unconditional dep in chatter-ui). For full features, build
# natively on Windows with the 'desktop' feature.
# windows-cross: GStreamer only, no LiveKit (webrtc-sys requires MSVC, can't cross-compile
# with MinGW). For full features including calls, build natively on Windows.
windows-cross = [
    "dep:i-slint-backend-winit", "dep:winit", "dep:arboard", "slint/backend-winit",
    "slint/renderer-software", "chatter-core/desktop-system", "chatter-core/desktop-gstreamer",
    "desktop-media-no-livekit"
]
desktop-media = [
    "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:gstreamer-gl",
    "dep:livekit", "dep:livekit-api", "dep:gstreamer-gl-egl", "dep:glutin_egl_sys"
]
desktop-media-no-livekit = [
    "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:gstreamer-gl",
    "dep:gstreamer-gl-egl", "dep:glutin_egl_sys"
]
local-ai = ["chatter-core/local-ai"]
mobile = ["dep:i-slint-backend-android-activity", "dep:android-activity", "slint/backend-android-activity-06"]

# =============================================================================
# Android Metadata (for cargo-apk)
# =============================================================================
[package.metadata.android]
package = "com.chatter.client"
label = "Chatter"
icon = "../../assets/icon.png"
min_sdk_version = 26
target_sdk_version = 34
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"
[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"
[[package.metadata.android.uses_permission]]
name = "android.permission.MODIFY_AUDIO_SETTINGS"
[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"
[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"
[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[[package.metadata.android.activity]]
config_changes = "orientation|screenSize|keyboardHidden"
# adjustResize makes Android shrink the window when keyboard appears
window_soft_input_mode = "adjustResize"

# Release signing: set CHATTER_KEYSTORE_PATH and CHATTER_KEYSTORE_PASSWORD env vars.
# [package.metadata.android.signing.release]
# path = "${CHATTER_KEYSTORE_PATH}"
# keystore_password = "${CHATTER_KEYSTORE_PASSWORD}"
