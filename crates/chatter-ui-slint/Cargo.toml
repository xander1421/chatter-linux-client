[package]
name = "chatter-ui-slint"
version = "0.1.0"
edition = "2024"
authors = ["xander1421"]
description = "Generated Slint components for the Chatter client"
license = "GPL-3.0"
rust-version = "1.99"

# No handwritten logic lives here. Test the components through chatter-ui's
# headless integration suites, without compiling the generated tree again.
[lib]
test = false
bench = false
doctest = false

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2"] }

# Embedded SVG/PNG resources need decoding even when this generated crate is
# checked without an application renderer to supply the runtime features.
i-slint-core = { version = "=1.18.1", default-features = false, features = ["image-decoders", "svg"] }

[build-dependencies]
slint-build = "=1.18.1"

[features]
ui-test-debug = []
