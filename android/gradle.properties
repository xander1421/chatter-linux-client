org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
# Our .so is large (debug, unstripped); keep it uncompressed + page-aligned so
# GameActivity's System.loadLibrary can map it directly from the APK.
android.bundle.enableUncompressedNativeLibs=true
# AGP 8.7.3 was tested up to compileSdk 35; 36 builds with it (verified by
# a RELEASE=1 build, 2026-10-11). Drop this when AGP is upgraded.
android.suppressUnsupportedCompileSdk=36
