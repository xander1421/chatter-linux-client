name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # attach the Windows bundle to the Release on a tag

env:
  CARGO_TERM_COLOR: always
  GSTREAMER_VERSION: "1.24.13"
  # Skia source paths can exceed MAX_PATH under the runner workspace.
  CARGO_TARGET_DIR: C:\t

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11

      - name: Import MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Native build tools
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -Type DWord
          git config --global core.longpaths true
          choco install nasm -y
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          if (!(Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            throw "The Windows runner must provide LLVM/libclang for bindgen"
          }

      # PUBLIC pins (repo Variables, same set as android/linux). Audited: reject
      # the committed development keys and a non-HTTPS/empty server URL so a
      # forgeable or misconfigured build can never be uploaded as a release.
      - name: Validate deployment trust anchors (audited)
        shell: pwsh
        env:
          CHATTER_SERVER_URL: ${{ vars.CHATTER_SERVER_URL }}
          CHATTER_TRUST_ROOT_PUBLIC_KEY_HEX: ${{ vars.CHATTER_TRUST_ROOT_PUBLIC_KEY_HEX }}
          CHATTER_KT_TREE_HEAD_PUBLIC_KEY_HEX: ${{ vars.CHATTER_KT_TREE_HEAD_PUBLIC_KEY_HEX }}
          CHATTER_KT_VRF_PUBLIC_KEY_HEX: ${{ vars.CHATTER_KT_VRF_PUBLIC_KEY_HEX }}
          CHATTER_RELEASE_UPDATE_PUBLIC_KEY_HEX: ${{ vars.CHATTER_RELEASE_UPDATE_PUBLIC_KEY_HEX }}
          CHATTER_TLS_ROOT_CA_PEM: ${{ vars.CHATTER_TLS_ROOT_CA_PEM }}
        run: |
          # Committed development public keys (scripts/anchors.sh DEV_*_HEX) —
          # forgeable by anyone with the repo; must never ship. Mirrors
          # packaging/check-release-inputs.sh.
          $dev = @(
            'ca49d96aa6417d724b4531dfc6cbdc8e291b5231caac088a3092de5120be6833',
            '88ad412806054a7534e1b9deb42ef249bd7c92709f5bebf1d6be7b0e40926f72',
            '48af975feaba33ea110d4ab0c8f7a38c5c7122db185ff9499b81e5e74da6ec47',
            'ca2efc2c4186cdcdf29fabe4f33975dd4672bc2e09469a42595a864fca39795a'
          )
          foreach ($name in @('CHATTER_TRUST_ROOT_PUBLIC_KEY_HEX','CHATTER_KT_TREE_HEAD_PUBLIC_KEY_HEX','CHATTER_KT_VRF_PUBLIC_KEY_HEX','CHATTER_RELEASE_UPDATE_PUBLIC_KEY_HEX')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value -cnotmatch '^[0-9a-fA-F]{64}$') { throw "Set repository Variable $name to the provisioned 32-byte public pin" }
            if ($dev -contains $value.ToLower()) { throw "$name is a committed development key — refusing to build a forgeable release" }
          }
          if ($env:CHATTER_TLS_ROOT_CA_PEM -notmatch '-----BEGIN CERTIFICATE-----') {
            throw "Set repository Variable CHATTER_TLS_ROOT_CA_PEM to the provisioned CA PEM"
          }
          if ($env:CHATTER_SERVER_URL -notmatch '^https://[a-z0-9.-]+') {
            throw "Set repository Variable CHATTER_SERVER_URL to the public HTTPS server origin"
          }

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: crt-static-boringssl-v2
          workspaces: ". -> C:/t"

      - name: Cache GStreamer install
        id: cache-gstreamer
        uses: actions/cache@v4
        with:
          path: C:\gstreamer
          key: gstreamer-${{ env.GSTREAMER_VERSION }}-msvc-x86_64-v1

      - name: Install GStreamer
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        uses: blinemedical/setup-gstreamer@v1
        with:
          version: ${{ env.GSTREAMER_VERSION }}

      - name: Set GStreamer env vars
        shell: pwsh
        run: |
          $gstRoot = $null
          $candidates = @(
            "C:\gstreamer\1.0\msvc_x86_64",
            "C:\gstreamer\1.0\x86_64",
            "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64"
          )
          foreach ($c in $candidates) {
            if ($c -and (Test-Path "$c\bin")) {
              $gstRoot = $c
              break
            }
          }

          if (!$gstRoot) {
            Write-Host "Searching for GStreamer installation..."
            Get-ChildItem "C:\gstreamer" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object FullName
            throw "GStreamer development installation was not found"
          }

          Write-Host "GStreamer root: $gstRoot"
          echo "GST_ROOT=$gstRoot" >> $env:GITHUB_ENV
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" >> $env:GITHUB_ENV
          echo "$gstRoot\bin" >> $env:GITHUB_PATH
          echo "PKG_CONFIG_PATH=$gstRoot\lib\pkgconfig" >> $env:GITHUB_ENV
          echo "LIB=$gstRoot\lib;$env:LIB" >> $env:GITHUB_ENV

      - name: Install pkg-config
        run: choco install pkgconfiglite -y

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # SQLCipher (rusqlite bundled-sqlcipher) needs a libcrypto. We deliberately
      # do NOT install vcpkg OpenSSL: webrtc-sys (via livekit) statically bundles
      # BoringSSL, and two different libcryptos exporting the same symbols
      # (EVP_*, HMAC, PKCS5_PBKDF2_HMAC, ...) collide. /FORCE:MULTIPLE keeps one,
      # so SQLCipher built against OpenSSL ends up calling BoringSSL's ABI ->
      # heap corruption -> crash on the first PRAGMA key opening the DB. Instead
      # we point SQLCipher at webrtc's BoringSSL so the binary has exactly ONE
      # libcrypto. Mirrors android/build-android.sh + build-windows.ps1.
      - name: Fetch webrtc.lib (downloads BoringSSL)
        shell: pwsh
        env:
          RUSTC_WRAPPER: ""
        run: |
          # webrtc-sys's build.rs downloads its prebuilt libwebrtc (BoringSSL
          # baked in) while building. Build just that crate first so webrtc.lib
          # exists before we point SQLCipher at it. webrtc-sys does NOT pull
          # rusqlite, so SQLCipher is not compiled here — it compiles in the main
          # build below, against BoringSSL.
          cargo build --locked --release -p webrtc-sys

      - name: Point SQLCipher at webrtc's BoringSSL
        shell: pwsh
        run: |
          $target = $env:CARGO_TARGET_DIR
          $webrtcLib = Get-ChildItem -Path $target -Recurse -Filter webrtc.lib -ErrorAction SilentlyContinue |
            Where-Object FullName -match 'win-x64-release' | Select-Object -First 1
          $bsslInc = Get-ChildItem -Path $target -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object FullName -match 'boringssl[\\/]src[\\/]include$' | Select-Object -First 1
          if (-not $webrtcLib -or -not $bsslInc) {
            Write-Error "webrtc.lib or BoringSSL include not found under target/ - did 'cargo build -p webrtc-sys' run?"
            exit 1
          }
          $stage = "$target\boringssl-sqlcipher"
          New-Item -ItemType Directory -Force -Path "$stage\lib" | Out-Null
          Copy-Item $webrtcLib.FullName "$stage\lib\libcrypto.lib" -Force   # -lcrypto -> BoringSSL
          echo "OPENSSL_DIR=$stage" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$stage\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$($bsslInc.FullName)" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
          # sqlite3.c includes <windows.h> -> <wincrypt.h>, whose X509_NAME etc.
          # macros collide with BoringSSL's typedefs (C2059). OpenSSL headers
          # #undef them; BoringSSL doesn't. NOCRYPT drops wincrypt.h (SQLCipher
          # uses BoringSSL's API, not Windows CryptoAPI).
          echo "LIBSQLITE3_FLAGS=-DNOCRYPT" >> $env:GITHUB_ENV
          Write-Host "SQLCipher -> BoringSSL: $stage\lib\libcrypto.lib  inc=$($bsslInc.FullName)"

      - name: Build release client (desktop and jarvis)
        env:
          RUSTC_WRAPPER: ""
          CHATTER_SERVER_URL: ${{ vars.CHATTER_SERVER_URL }}
          CHATTER_TRUST_ROOT_PUBLIC_KEY_HEX: ${{ vars.CHATTER_TRUST_ROOT_PUBLIC_KEY_HEX }}
          CHATTER_KT_TREE_HEAD_PUBLIC_KEY_HEX: ${{ vars.CHATTER_KT_TREE_HEAD_PUBLIC_KEY_HEX }}
          CHATTER_KT_VRF_PUBLIC_KEY_HEX: ${{ vars.CHATTER_KT_VRF_PUBLIC_KEY_HEX }}
          CHATTER_RELEASE_UPDATE_PUBLIC_KEY_HEX: ${{ vars.CHATTER_RELEASE_UPDATE_PUBLIC_KEY_HEX }}
          CHATTER_TLS_ROOT_CA_PEM: ${{ vars.CHATTER_TLS_ROOT_CA_PEM }}
          CHATTER_NTFY_URL: ${{ vars.CHATTER_NTFY_URL }}
          CHATTER_ONION_ADDR: ${{ vars.CHATTER_ONION_ADDR }}
          # Keep target CRT/linker settings from .cargo/config.toml.
        run: cargo build --locked --release -p chatter-ui --no-default-features --features desktop,jarvis

      - name: Bundle release artifact
        shell: pwsh
        run: |
          # Fail the job on any uncaught error (copy failures, missing exe, etc.).
          # Optional DLL probes below guard with `Test-Path` and do NOT rely on
          # $ErrorActionPreference to swallow failures.
          $ErrorActionPreference = "Stop"
          mkdir artifact | Out-Null

          # The chatter-ui crate produces `chatter-ui.exe` on Windows (crate name
          # from `[[bin]] name = "chatter-ui"` in Cargo.toml). Rename to the
          # customer-facing `chatter-windows.exe` for the release artifact.
          $exePath = "$env:CARGO_TARGET_DIR/release/chatter-ui.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Release binary not found at $exePath — did the build step succeed?"
            exit 1
          }
          Copy-Item $exePath "artifact/chatter-windows.exe"

          $gstBin = "$env:GST_ROOT\bin"
          $gstPlugins = "$env:GST_ROOT\lib\gstreamer-1.0"

          # Copy EVERY runtime DLL from the GStreamer bin dir. Hand-listing
          # core DLLs was whack-a-mole: ffi-8 missing crashed the exe, then
          # gstriff / avcodec / avformat etc. (deps of the isomp4, matroska,
          # libav, d3d11/12 plugins) were missing and those plugins failed to
          # load. The bin dir holds all gst libs + their support deps; copy the
          # lot so any bundled plugin resolves its dependencies.
          Copy-Item "$gstBin\*.dll" artifact/
          # Fail loud rather than ship a bundle missing the libffi runtime.
          if (-not (Get-ChildItem "artifact\ffi-*.dll" -ErrorAction SilentlyContinue)) {
            Write-Error "ffi runtime DLL missing from bundle"; exit 1
          }

          mkdir artifact/lib/gstreamer-1.0 -Force | Out-Null
          $plugins = @(
            "gstcoreelements.dll", "gstcoretracers.dll",
            "gstplayback.dll", "gsttypefindfunctions.dll",
            "gstvideoconvertscale.dll", "gstaudioconvert.dll",
            "gstaudioresample.dll", "gstvolume.dll",
            "gstautodetect.dll", "gstapp.dll",
            "gstwasapi2.dll", "gstd3d11.dll", "gstd3d12.dll",
            "gstisomp4.dll", "gstmatroska.dll",
            "gstvideoparsersbad.dll", "gstaudioparsers.dll",
            "gstopenh264.dll", "gstvpx.dll", "gstopus.dll",
            "gstlibav.dll"
          )
          foreach ($p in $plugins) {
            if (Test-Path "$gstPlugins\$p") { cp "$gstPlugins\$p" artifact/lib/gstreamer-1.0/ }
          }

          Write-Host "=== Artifact contents ==="
          Get-ChildItem artifact -Recurse | ForEach-Object {
            $size = if ($_.Length) { "{0:N0} KB" -f ($_.Length/1KB) } else { "dir" }
            Write-Host "  $($_.FullName)  ($size)"
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: chatter-windows-x64
          path: artifact/
          retention-days: 30

      - name: Zip bundle for the Release (tag push only)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $zip = "chatter-windows-x64-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path artifact/* -DestinationPath $zip -Force
          echo "WIN_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Attach to GitHub Release (tag push only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.WIN_ZIP }}
