<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Accretion disk gradient -->
    <linearGradient id="diskGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer glow for lensing effect -->
    <filter id="outerGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radial gradient for photon sphere -->
    <radialGradient id="photonSphere" cx="50%" cy="50%" r="50%">
      <stop offset="60%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#1a0a00;stop-opacity:1" />
      <stop offset="90%" style="stop-color:#331100;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background (transparent for icon use) -->
  <rect width="512" height="512" fill="transparent"/>

  <!-- Gravitational lensing ring (bent light from behind) -->
  <ellipse cx="256" cy="256" rx="220" ry="220"
           fill="none" stroke="#ffa500" stroke-width="3"
           opacity="0.3" filter="url(#outerGlow)"/>

  <!-- Accretion disk - back half (appears above due to lensing) -->
  <ellipse cx="256" cy="180" rx="200" ry="40"
           fill="none" stroke="url(#diskGradient)" stroke-width="12"
           filter="url(#glow)" opacity="0.9"/>

  <!-- Accretion disk - front half -->
  <ellipse cx="256" cy="332" rx="200" ry="40"
           fill="none" stroke="url(#diskGradient)" stroke-width="8"
           filter="url(#glow)" opacity="0.7"/>

  <!-- Photon sphere / event horizon glow -->
  <circle cx="256" cy="256" r="120" fill="url(#photonSphere)"/>

  <!-- Event horizon (pure black) -->
  <circle cx="256" cy="256" r="90" fill="#000000"/>

  <!-- Inner shadow ring -->
  <circle cx="256" cy="256" r="92"
          fill="none" stroke="#ff4500" stroke-width="2" opacity="0.4"/>
</svg>
