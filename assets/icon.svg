<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Chatter — "Split": one square cut corner to corner, halves pulled apart.
       Two flat shapes, no strokes, no gradients: nothing degrades at 16 px. -->
  <defs>
    <clipPath id="plate"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#08090C"/>
  <g clip-path="url(#plate)">
    <polygon points="86,86 388,86 86,388" fill="#E9E7E2"/>
    <polygon points="424,124 424,426 122,426" fill="#2DD4BF"/>
  </g>
</svg>
